# Weekly dependency updates, opened as pull requests so the build and the
# browser smoke gate decide whether they are safe rather than a human reading
# a version number.
#
# This existed once and was removed in #59. What removing it actually did was
# freeze the toolchain: every dependency here is a caret range over a
# committed lockfile, so nothing moves without a manual pull request, and
# nothing tells anybody that months have passed. The two that matter most are
# the transpiler and the abaplint CLI - this repository downports and
# transpiles the framework on a daily cron, so an upstream fix landing there
# is the whole point of the schedule.
#
# @abaplint/cli is pinned exactly, on purpose (see README): its --fix output
# IS the downport, and a floating version silently changes the code that gets
# bundled. Dependabot will offer that bump as its own reviewable pull request,
# which is the intended way to move it.
#
# Grouped one pull request per ecosystem: a handful of build-time tools, and
# separate pull requests for each would be read by nobody. A group that fails
# is bisected by dropping a line from it.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:30"
    open-pull-requests-limit: 5
    groups:
      toolchain:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:30"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
