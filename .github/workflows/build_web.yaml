name: build_web

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read
  issues: write  # to report failed scheduled runs

env:
  # peaceiris/actions-gh-pages@v4 still ships with node20; force the runner to
  # execute it on node24 until upstream publishes a node24-based release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build_web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        cache: 'npm'
    - run: npm ci
    - run: npm run clone
    - run: npm run build && node output/index.mjs
    - run: npm run webpack:build
    - name: deploy to web-abap2UI5-build
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/main' && github.repository == 'abap2UI5/web-abap2UI5'
      with:
        deploy_key: ${{ secrets.DEPLOY_WEB }}
        external_repository: abap2UI5/web-abap2UI5-build
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        publish_branch: main
        force_orphan: true
        publish_dir: ./build
    - name: Report scheduled failure as issue
      if: failure() && github.event_name == 'schedule'
      uses: abap2UI5/abap2UI5/.github/actions/report-scheduled-failure@main
